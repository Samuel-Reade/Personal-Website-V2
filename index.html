<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samuel Reade — Portfolio</title>
    <meta name="description" content="Walk through Samuel Reade's portfolio — a small painterly 3D world." />

    <!-- Space Grotesk 500-700 for display, Inter 400-600 for body; wired to
         --font-display / --font-body in styles.css. `display=swap` so the
         overlays render in the fallback stack immediately rather than sitting
         invisible over the scene while the fonts arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
